<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tela de cadastro</title><link rel="stylesheet" th:href="@{/css/style_tela_cadastro.css}"></head>
<body><div class="header"><div class="dados">
<h2>CADASTRO DE USUÁRIOS</h2><h3>INFORMAÇÕES PESSOAIS:</h3>
<form method="post" action="/usuarios/cadastrar">
<div class="dados-nome"><h4>Nome:</h4><input type="text" class="campo" name="nome"></div>
<div class="dados-senha"><h4>Senha:</h4><input type="password" class="campo" name="senha"></div>
<div class="dados-email"><h4>Email:</h4><input type="email" class="campo" name="email"></div>
<div class="dados-contato"><h4>Contato:</h4><input type="text" class="campo" name="contato"></div>
<div th:if="${erro}" th:text="${erro}"></div><div class="cadastrar"><h4>Já possui login? <a href="/login">FAZER LOGIN</a></h4></div>
<div class="botao-confirmar"><button type="submit">CONFIRMAR</button></div>
</form></div></div></body></html>
